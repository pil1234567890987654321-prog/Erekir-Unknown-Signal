sector.erekir-lost-sectors-powernexus.name = Power Nexus
sector.erekir-lost-sectors-powernexus.description = The sector is heavily defended. Enemy forces outnumber ours several times over — the enemy relies on [accent]quantity[white], not quality. Individually, they are weak, but there are [scarlet]hundreds[white]. Thousands. This is not just a battle — it is a [scarlet]slaughter[white].\n\n[scarlet]⚠️ WARNING ⚠️[white]\nThe sector's signature matches the control system of [scarlet]"???"[white]. If this is indeed an archive, we will gain the key to Trifecta.\n\n[red]They will come in waves[white]. [red]They will overwhelm us with numbers[white]. [scarlet]But we will not retreat[white].\n\n[#FFD700]They are waiting for us. They will meet us. They will remember us.'[white]

sector.erekir-lost-sectors-narrows.name = The Narrows
sector.erekir-lost-sectors-narrows.description = This narrow passage serves as an important route through the region. Enemy forces use it to transport reinforcements. Secure this area and prevent the enemy from moving freely through the region.

sector.erekir-lost-sectors-thicket.name = The Dark Thicket
sector.erekir-lost-sectors-thicket.description = Vast thorium deposits cover this sector, forming a strange crystalline thicket. These riches have made the region an important target for the enemy, who will not give it up without a fight. Obtain [accent]surge alloy[white] and [accent]carbide[white].\n\nBegin defending.\nLeave nothing standing.

sector.erekir-lost-sectors-Expanse.name = Expanse
sector.erekir-lost-sectors-Expanse.description=An enemy presence has been detected in this sector. The region isnt of significant strategic importance, but rich in resources. Secure the area and destroy the enemy base.

sector.erekir-lost-sectors-arky.name = [red]The Sixth Arkycite Circle
sector.erekir-lost-sectors-arky.description =[gray][The sector is under development][white]\nThe arkycite fields of this region are of immense value. The enemy has turned the sector into a powerful stronghold, preventing us from establishing a foothold here.\nCapture this sector. Wipe the enemy from the face of the planet.

