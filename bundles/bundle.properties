block.erekir-lost-sectors-conflagration.name = Conflagration

block.erekir-lost-sectors-conflagration.description = [#ff4a28]Experimental energy turret.[]\n[#9b9b9b]Two independent emitters create converging energy streams, turning every attack into a powerful burst of energy. The construction requires constant cooling to prevent overheating.[]\n[#ff8a24]The origin of this technology is unknown.[]\n\n[#ff3030]RESEARCH LOG // 021[]\n[#9b9b9b]We were unable to determine the purpose of the second emitter.[]\n[#cfcfcf]It does not duplicate the first.\nIt complements it...[]\n\n[#ff3030]When activated simultaneously, both emitters produce the same energy pattern detected in the signal.[]

block.erekir-lost-sectors-factory1.name = Cryxium Synthesizer

block.erekir-lost-sectors-factory1.description = Smelts cryxium from beryllium, graphite, and oxide. Requires heat to operate.

item.erekir-lost-sectors-cryxium.name = Cryxium

block.erekir-lost-sectors-Resonance.name = Resonance

block.erekir-lost-sectors-Resonance.description = Fires a powerful laser at enemies.

liquid.erekir-lost-sectors-Br.name = Bromine

block.erekir-lost-sectors-factory2.name = Bromine Mixer

block.erekir-lost-sectors-factory2.description = Converts beryllium and ozone into bromine.

block.erekir-lost-sectors-cryxium-duct.name = Cryxium Duct

block.erekir-lost-sectors-cryxium-duct.description = Transports items forward. Faster than a standard duct.

block.erekir-lost-sectors-dduct.name = Cryxium Duct Bridge

block.erekir-lost-sectors-dduct.description = Transports items over terrain. Faster than a standard duct bridge and capable of spanning greater distances.

block.erekir-lost-sectors-phas.name = Phase-Cryxium Conveyor

block.erekir-lost-sectors-phas.description = Transports items over terrain or buildings. Has a greater range than bridges, but requires power.

block.erekir-lost-sectors-sever.name = Sever

block.erekir-lost-sectors-sever.description = [#ff4a28]Unknown automated turret.[]\n[#9b9b9b]Its design resembles early Serpulo weapon systems, but what is it doing here?.. However, some of its components have no known technological equivalent.[]\n[#ff8a24]The same unknown signal found in other recovered devices has been detected on its hull.[]

block.erekir-lost-sectors-pyroclast.name = Pyroclast

block.erekir-lost-sectors-pyroclast.description = Fires a continuous stream of flame at enemy targets. More powerful than the Flare.

block.erekir-lost-sectors-breakout.name = Breakout

block.erekir-lost-sectors-breakout.description = Fires. What else do you want to see here?..

block.erekir-lost-sectors-Resonance.name = Resonance

block.erekir-lost-sectors-Resonance.description = [#ff4a28]Technology of unknown origin.[]\n[#9b9b9b]Discovered among the ruins of one of Erekir's forgotten sectors. The device accumulates energy before releasing it as a powerful energy beam.[]\n[#ff8a24]Its operating principle remains unknown.[]\n\n[#ff3030]RESEARCH LOG // 014[]\n[#9b9b9b]During testing, an unknown signal was detected before every shot.[]\n[#cfcfcf]The signal is not a side effect.\nIt appears 0.7 seconds before firing.[]\n\n[#ff3030]It is receiving something from outside...[]\n[scarlet]Not recommended for use.[]

block.erekir-lost-sectors-siligone.name = Silicon Arc Crucible

block.erekir-lost-sectors-siligone.description = Produces silicon from sand and graphite. Significantly more efficient than a Silicon Arc Furnace, but requires heat and slag to operate.

item.erekir-lost-sectors-cryxium.description = [#ff4a28]A peculiar nonmetal discovered in the little-explored regions of Erekir.[]\n[#9b9b9b]Cryxium possesses high strength and unusual energetic properties, making it useful for advanced structures and technologies.[]\n[#ff8a24]Its origin remains [scarlet]classified[#ff8a24].[]\n\n[#ff3030]RESEARCH LOG // 007[]\n[#cfcfcf]We discovered it deep beneath the surface of one of the forgotten sectors (The Dark Thicket).[]\n[#cfcfcf]It does not correspond to any known Erekir mineral.[]\n[#9b9b9b]Before extraction, the sample was completely inert. Several seconds later, the instrument readings changed.\n[#ff3030]This nonmetal poses a potential hazard.\nObservation continues.[]

block.erekir-lost-sectors-cryxium-wall.name = Cryxium Wall

block.erekir-lost-sectors-cryxium-wall.description = Protects structures from enemy projectiles. When supplied with power, generates a shield that absorbs projectiles. Conducts power. Periodically releases lightning when hit.

block.erekir-lost-sectors-UMT.name = Unit Maintenance Station

block.erekir-lost-sectors-UMT.description = An advanced maintenance station designed to restore damaged units.

block.erekir-lost-sectors-crusher-cryxium.name = Advanced Rock Crusher

block.erekir-lost-sectors-crusher-cryxium.description = Crushes walls at an even greater speed, producing sand. Efficiency depends on the type of wall. Requires bromine and graphite to operate.

block.erekir-lost-sectors-cryxium-wall.name = Cryxium Wall

block.erekir-lost-sectors-cryxium-wall.description = Protects structures from enemy projectiles. When supplied with power, generates a shield that absorbs projectiles. Conducts power. Periodically releases lightning when hit.

