# Sectors
sector.erekir-lost-sectors-valleyy.name = Scorched Valley
sector.erekir-lost-sectors-valleyy.description=An expansive valley rich in [accent]tungsten[white] deposits. The enemy has not yet established a significant presence in the region, giving us a good opportunity to secure this area and continue our advance.


sector.erekir-lost-sectors-relay-station.name = Relay Station
sector.erekir-lost-sectors-relay-station.description =[red](Possibility is not confirmed!)\n\n[gray][optional objective][white]\nContact with this relay station has been lost. Recover the facility and determine the cause of the communication failure.

sector.erekir-lost-sectors-anomaly-site.name = Anomaly Site
sector.erekir-lost-sectors-anomaly-site.description =[gray][optional objective][white]\nAn unidentified signal has been detected near the polar region. Investigate its source.

sector.erekir-lost-sectors-Trifecta.name=Trifecta
sector.erekir-lost-sectors-Trifecta.description=Intel has detected anomalous activity in the sector.\nInstead of the [accent]three[white] reported cores, a vast network of fortified enemy bases has been uncovered - \nat least [accent]seven[white] hostile citadels, integrated into a unified defensive system. Looks like they were expecting us.\n\n[#FFD700]⚠️ WARNING ⚠️[white]\nThe sector is a [accent]MASSIVE factory[white] for unit production.\nThe enemy is churning them out [scarlet]in unfathomable quantities.[white].\n\n[scarlet]⚠️ ATTENTION ⚠️[white]\nThe enemy relies on [accent]numbers[white] - individually they are weak, but there are [scarlet]hundreds[white] of them. Thousands.\nThey will attack from all sides, giving you no rest.\n\nExpect [accent]multiple waves[white] of resistance: They will come [accent]from the front[white].\nThey will come [accent]from the sky[white].\nThey will come [scarlet]from where you least expect them[white].\n\n[red]Each wave[white] — is a [red]trial[white].\n[red]Each enemy[white] — is a [red]threat[white].\n[scarlet]Each minute[white] — is a [scarlet]struggle... for survival[white].\n\n[#FFD700]This sector [scarlet]must fall.[#FFD700] At any cost.[white]

