sector.erekir-lost-sectors-Trifecta.description=Радиоразведка зафиксировала аномальную активность в секторе. Вместо [accent]трех[white] заявленных ядер обнаружена целая сеть укрепленных баз противника - по меньшей мере [accent]семь[white] вражеских цитаделей, объединенных в единую оборонительную систему. Похоже, нас ждал теплый прием.\n\n[#FFD700]⚠️ ПРЕДУПРЕЖДЕНИЕ ⚠️[white]\nСектор представляет собой [accent]гигантский завод[white] по производству боевых единиц. Противник штампует их [scarlet]в огромном количестве[white][white]\n\n[scarlet]⚠️ ВНИМАНИЕ ⚠️[white]\nПротивник делает ставку на [accent]количество[white] — по одиночке они слабы, но их [scarlet]сотни[white]. Тысячи. Они будут лезть со всех сторон, не давая передохнуть.\n[#FF6B35][white]\nОжидается [accent]множество волн[white] сопротивления. Они придут [accent]с фронта[white]. Они придут [accent]с неба[white]. Они придут [scarlet]оттуда, откуда ты не ждёшь[white].\n\n[red]Каждая волна[white] — это [red]испытание[white].\n[red]Каждый враг[white] — это [red]угроза[white].\n[scarlet]Каждая минута[white] — это [scarlet]борьба... за выживание[white].\n\n[#FFD700]Этот сектор должен пасть. Любой ценой.[white]\n

