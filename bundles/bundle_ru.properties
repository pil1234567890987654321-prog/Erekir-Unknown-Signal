sector.erekir-lost-sectors-valleyy.name = Выжженная долина
sector.erekir-lost-sectors-valleyy.description = Обширная долина с большими залежами [accent]вольфрама.[white] Враг пока не успел значительно закрепиться в этом регионе, что дает нам хорошую возможность закрепиться здесь и продолжить продвижение.

sector.erekir-lost-sectors-relay-station.name = Релейная станция
sector.erekir-lost-sectors-relay-station.description =[red](Возможность не подтверждена!)\n\n[gray][опциональная цель][white]\nСвязь с этой релейной станцией потеряна. Восстановите объект и выясните причину сбоя связи.

sector.erekir-lost-sectors-anomaly-site.name = Зона аномалии
sector.erekir-lost-sectors-anomaly-site.description =[gray][опциональная цель][white]\nВ районе полюса обнаружен неизвестный сигнал. Исследуйте источник аномалии.

sector.erekir-lost-sectors-Trifecta.name=Трифекта
sector.erekir-lost-sectors-Trifecta.description=Радиоразведка зафиксировала аномальную активность в секторе.\nВместо [accent]трёх[white] заявленных ядер обнаружена целая сеть укреплённых баз противника — \nпо меньшей мере [accent]семь[white] вражеских цитаделей, объединённых в единую оборонительную систему. Похоже, нас ждал тёплый приём.\n\n[#FFD700]⚠️ ПРЕДУПРЕЖДЕНИЕ ⚠️[white]\nСектор представляет собой [accent]ГИГАНТСКИЙ ЗАВОД[white] по производству юнитов.\nПротивник штампует их [scarlet]в непостижимых количествах[white].\n\n[scarlet]⚠️ ВНИМАНИЕ ⚠️[white]\nПротивник делает ставку на [accent]число[white] — по одиночке они слабы, но их [scarlet]сотни[white]. Тысячи.\nОни будут атаковать со всех сторон, не давая передышки.\n\nОжидайте [accent]множество волн[white] сопротивления: Они придут [accent]с фронта[white].\nОни придут [accent]с неба[white].\nОни придут [scarlet]оттуда, откуда ты их не ждёшь[white].\n\n[red]Каждая волна[white] — это [red]испытание[white].\n[red]Каждый враг[white] — это [red]угроза[white].\n[scarlet]Каждая минута[white] — это [scarlet]борьба... за выживание[white].\n\n[#FFD700]Этот сектор [scarlet]должен пасть[#FFD700]. Любой ценой.[white]

