sector.erekir-lost-sectors-powernexus.name = Энергохаб
sector.erekir-lost-sectors-powernexus.description = Сектор усиленно охраняется. Вражеские силы превосходят наши в разы - противник делает ставку на [accent]количество[white], а не качество. По одиночке они слабы, но их [scarlet]сотни[white]. Тысячи. Это не просто битва - это [scarlet]бойня[white].\n\n[scarlet]⚠️ ВНИМАНИЕ ⚠️[white]\nСигнатура сектора совпадает с системой управления [scarlet]"???"[white]. Если это действительно архив - мы получим ключ к Трифекте.\n\n[red]Они придут волнами[white]. [red]Они будут давить числом[white]. [scarlet]Но мы не отступим[white].\n\n[#FFD700]Нас ждут. Нас встретят. Нас запомнят.[white]

sector.erekir-lost-sectors-narrows.name = Теснина
sector.erekir-lost-sectors-narrows.description = Этот узкий проход представляет собой важный маршрут через регион. Вражеские силы используют его для переброски подкреплений. Закрепитесь здесь и не позволяйте противнику свободно перемещаться по территории.

sector.erekir-lost-sectors-thicket.name = Мрачная чаща
sector.erekir-lost-sectors-thicket.description = Огромные залежи тория покрывают этот сектор, образуя причудливую кристаллическую чащу. Эти богатства сделали регион важной целью для врага, который не собирается отдавать его без сопротивления.\nПолучите [accent]кинетический сплав[white] и [accent]карбид[white]. Начните обороняться. Не оставьте камня на камне.

sector.erekir-lost-sectors-Expanse.name = Раздолье
sector.erekir-lost-sectors-Expanse.description=В этом секторе обнаружено вражеское присутствие. Регион не имеет важное стратегическое значение, но богат ресурсами. Закрепитесь здесь и уничтожьте вражескую базу.

sector.erekir-lost-sectors-arky.name = [red]Шестой Аркицитовый круг
sector.erekir-lost-sectors-arky.description=[gray][Сектор находится в стадии разработки][white]\nАркицитовые поля этого региона представляют огромную ценность. Враг превратил сектор в мощный опорный пункт, не позволяя нам закрепиться здесь.\nЗахватите этот сектор. Сотрите врага с лица земли.

sector.erekir-lost-sectors-Hexide.name = Гексис
sector.erekir-lost-sectors-Hexide.description = СЕКТОР СТРОИТСЯ
status.erekir-lost-sectors-overheating.name = Перегрев
block.erekir-lost-sectors-conflagration.name = Всесожженние
block.erekir-lost-sectors-conflagration.description =[#ff4a28]Экспериментальная энергетическая турель.[]\n[#9b9b9b]Два независимых излучателя формируют сходящиеся энергетические потоки, превращая каждую атаку в мощный всплеск энергии. Конструкция требует постоянного охлаждения для предотвращения перегрева.[]\n[#ff8a24]Происхождение технологии неизвестно.[]\n\n[#ff3030]RESEARCH LOG // 021[]\n[#9b9b9b]Мы не смогли определить назначение второго излучателя.[]\n[#cfcfcf]Он не дублирует первый.\nОн точно дополняет его...[]\n\n[#ff3030]При одновременной активации оба излучателя образуют один и тот же энергетический рисунок, обнаруженный в сигнале.[]
block.erekir-lost-sectors-factory1.name = Синтезатор криксия
block.erekir-lost-sectors-factory1.description = Выплавляет криксий из аркицита, графита и оксида. Требует тепло для работы
item.erekir-lost-sectors-cryxium.name=Криксий
block.erekir-lost-sectors-Resonance.name = Резонанс
block.erekir-lost-sectors-Resonance.description = Стреляет мощным лазером по врагу.
liquid.erekir-lost-sectors-Br.name = Бром
block.erekir-lost-sectors-factory2.name=Бромовая мешалка
block.erekir-lost-sectors-factory2.description=Превращает аркицит и озон в бром.
block.erekir-lost-sectors-cryxium-duct.name=Криксиевый предметный канал
block.erekir-lost-sectors-cryxium-duct.description=Перемещает предметы вперед. Быстрее, чем обычный предметный канал
block.erekir-lost-sectors-dduct.name=Криксиевый канальный мост
block.erekir-lost-sectors-dduct.description=Перемещает предметы над местностью. Быстрее, чем обычный канальный мост. Большая дальность перемещения.
block.erekir-lost-sectors-phas.name=Фазово-криксиевый конвейер
block.erekir-lost-sectors-phas.description=Перемещает предметы над местностью или зданиями. Большая дистанция, чем у мостов, но требует энергию.
block.erekir-lost-sectors-sever.name="Север"
block.erekir-lost-sectors-sever.description=[#ff4a28]Неизвестная автоматическая турель.[]\n[#9b9b9b]Конструкция напоминает ранние образцы оружейных систем Серпуло, тогда что оно тут делает?.. Однако. Некоторые детали не имеют аналогов среди известных технологий.[]\n[#ff8a24]На корпусе обнаружен тот же неизвестный сигнал, что и у других найденных устройств.[]
block.erekir-lost-sectors-pyroclast.name=Вулканит
block.erekir-lost-sectors-pyroclast.description=Стреляет непрерывной струей пламени по вражеским целям. Мощнее, чем турель "Пламя".
block.erekir-lost-sectors-breakout.name=Разнос
block.erekir-lost-sectors-breakout.description=Стреляет. Что еще вы хотите тут увидеть?..
block.erekir-lost-sectors-Resonance.name=Отзвук
block.erekir-lost-sectors-Resonance.description=[#ff4a28]Неизвестная технология неизвестного происхождения.[]\n[#9b9b9b]Обнаружена среди руин одного из забытых секторов Эрекира. Устройство накапливает энергию, после чего высвобождает ее в виде мощного энергетического луча.[]\n[#ff8a24]Принцип работы остается неизвестным.[]\n\n[#ff3030]RESEARCH LOG // 014[]\n[#9b9b9b]Во время испытания перед каждым выстрелом был зарегистрирован неизвестный сигнал.[]\n[#cfcfcf]Сигнал не является побочным эффектом.\nОн появляется за 0.7 секунды до выстрела.[]\n\n[#ff3030]Оно получает что-то извне...[][scarlet]\nНе рекомендовано к использованию.
block.erekir-lost-sectors-siligone.name=Кремниевый дуговой тигель
block.erekir-lost-sectors-siligone.description=Производит кремний из песка и графита. Значительно лучше, чем Печь, но требует тепло и шлак для работы.
item.erekir-lost-sectors-cryxium.description =[#ff4a28]Причудливый неметалл, обнаруженный в малоизученных регионах Эрекира.[]\n[#9b9b9b]Криксий обладает высокой прочностью и необычными энергетическими свойствами, благодаря чему используется в производстве продвинутых конструкций и технологий.[]\n[#ff8a24]Его происхождение остается [scarlet]засекреченным[#ff8a24].[]\n\n[#ff3030]RESEARCH LOG // 007[]\n[#cfcfcf]Мы обнаружили его глубоко под поверхностью одного из забытых секторов (Мрачная чаща).[]\n[#cfcfcf]Он не соответствует ни одному известному минералу Эрекира.[]\n[#9b9b9b]До извлечения образец был полностью инертен. Через несколько секунд показания приборов изменились.\n[#ff3030]Данный неметалл представляет потенциальную опасность.\nНаблюдение продолжается.[]

block.erekir-lost-sectors-cryxium-wall.name=Криксиевая стена
block.erekir-lost-sectors-cryxium-wall.description = Защищает постройки от вражеских снарядов. При подаче энергии создает щит, поглощающий пули. Проводит энергию. Периодически выпускает молнии при ударе

block.erekir-lost-sectors-UMT.name=Станция обслуживания
block.erekir-lost-sectors-UMT.description = Продвинутая ремонтная станция, предназначенная для восстановления поврежденных юнитов.
block.erekir-lost-sectors-crusher-cryxium.name=Улучшенный дробитель скал
block.erekir-lost-sectors-crusher-cryxium.description = Дробит стены с еще большей скоростью, выводя песок. Эффективность зависит от типа стены. Требует бром и графит для работы.

block.erekir-lost-sectors-cryxium-wall.name=Криксиевая стена
block.erekir-lost-sectors-cryxium-wall.description = Защищает постройки от вражеских снарядов. При подаче энергии создает щит, поглощающий пули. Проводит энергию. Периодически выпускает молнии при ударе

status.erekir-lost-sectors.nitroshock.name=НитроВШоке
block.erekir-lost-sectors-shieldedwall-small.name=Малая экранированная стена
block.erekir-lost-sectors-shieldedwall-small.description = Защищает постройки от вражеских снарядов. При подаче энергии создает щит, поглощающий пули. Проводит энергию.

help=[accent]Запуск произв-ва: