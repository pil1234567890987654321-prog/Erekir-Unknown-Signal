sector.erekir-lost-sectors-powernexus.description = Сектор усиленно охраняется. Вражеские силы превосходят наши в разы - противник делает ставку на [accent]количество[white], а не качество. По одиночке они слабы, но их [scarlet]сотни[white]. Тысячи. Это не просто битва - это [scarlet]бойня[white].\n\n[scarlet]⚠️ ВНИМАНИЕ ⚠️[white]\nСигнатура сектора совпадает с системой управления [scarlet]"???"[white]. Если это действительно архив - мы получим ключ к Трифекте.\n\n[red]Они придут волнами[white]. [red]Они будут давить числом[white]. [scarlet]Но мы не отступим[white].\n\n[#FFD700]Нас ждут. Нас встретят. Нас запомнят.[white]